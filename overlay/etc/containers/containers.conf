# Mica OS engine configuration. containers-common is not installed, so this is
# the only containers.conf; values were read from podman v6.1.2's source.

[containers]
init_path = "/usr/libexec/podman/catatonit"

# podman drops CAP_NET_RAW; ping in a container needs ICMP datagram sockets.
default_sysctls = [
  "net.ipv4.ping_group_range=0 0",
]

# No log_driver: mica-containerd runs every container with k8s-file under /run
# (RAM), on either init.

[engine]
runtime = "crun"
image_copy_tmp_dir = "/mica/containers/tmp"

# No cgroup_manager: podman picks systemd when systemd runs, so conmon and each
# container get scopes of their own and outlive a restart of mica-containerd,
# and cgroupfs on an OpenRC root.

# Absolute paths: the default search lists start under /usr/local.
conmon_path = ["/usr/libexec/podman/conmon"]
helper_binaries_dir = ["/usr/libexec/podman"]

[engine.runtimes]
crun = ["/usr/bin/crun"]

[network]
# The rootful default /etc/containers/networks is on the read-only root.
network_config_dir = "/mica/containers/networks"

# firewall_driver stays unset: netavark 2.1.0 defaults to nftables and execs nft.
